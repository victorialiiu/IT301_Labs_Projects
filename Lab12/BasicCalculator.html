<h1 id="greeting"></h1>

<p>
  Number 1: <input type="number" id="num1"><br><br>
  Number 2: <input type="number" id="num2">
</p>

<p>
  <input type="radio" name="op" value="add" checked> Addition<br>
  <input type="radio" name="op" value="subtract"> Subtraction<br>
  <input type="radio" name="op" value="multiply"> Multiplication<br>
  <input type="radio" name="op" value="divide"> Division
</p>

<button onclick="calculate()">Calculate</button>
<button onclick="clearScreen()">Clear</button>

<h2 id="result"></h2>

<script>
var name = prompt("What is your name?");
document.getElementById("greeting").textContent = "Hello, " + name + "!";

function doMath(x, y, op) {
    if (op === "add") {
    return x + y;
  } else if (op === "subtract") {
    return x - y;
  } else if (op === "multiply") {
    return x * y;
  } else {
    return x / y;
  }
}

function getOperation() {
  var radios = document.getElementsByName("op");
  for (var i = 0; i < radios.length; i++) {
    if (radios[i].checked) {
      return radios[i].value;
    }
  }
}

function calculate() {
  var box1 = document.getElementById("num1");
  var box2 = document.getElementById("num2");
  var out = document.getElementById("result");

  if (box1.value === "" || box2.value === "") {
    out.textContent = "Please enter two numbers.";
    return;
  }

  var a = Number(box1.value);
  var b = Number(box2.value);
  var op = getOperation();

  if (isNaN(a) || isNaN(b)) {
    out.textContent = "Please enter two numbers.";
    return;
  }

  if (op === "divide" && b === 0) {
    out.textContent = "Cannot divide by zero.";
    return;
  }

  out.textContent = "Result: " + doMath(a, b, op);
}

function clearScreen() {
  document.getElementById("num1").value = "";
  document.getElementById("num2").value = "";
  document.getElementById("result").textContent = "";
  document.querySelector('input[name="op"][value="add"]').checked = true;
  name = prompt("What is your name?");
  document.getElementById("greeting").textContent = "Hello, " + name + "!";
}
</script>
