<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        let posts = [];
 
        function showPosts(list) {
            list.forEach((post) => {
                document.body.insertAdjacentHTML('beforeend',
                    `<article>
                        <h2>${post.title}</h2>
                        <p>${post.body}</p>
                        <p>User ID: ${post.userId} | Post ID: ${post.id}</p>
                    </article>`);
            });
        }
 
        function clearArticles() {
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
        }

        fetch('https://jsonplaceholder.typicode.com/posts')
            .then((response) => response.json())
            .then((data) => {
                posts = data;
                console.table(posts);
                showPosts(posts);
            });

        document.getElementById('filterBtn').addEventListener('click', () => {
            const id = Number(document.getElementById('userID').value);
            console.table(posts.filter((post) => post.userId === id));
        });

         document.getElementById('displayUserBtn').addEventListener('click', () => {
            const id = Number(document.getElementById('displayUserID').value);
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
            showPosts(posts.filter((post) => post.userId === id));
        });

        document.getElementById('findBtn').addEventListener('click', () => {
            const id = Number(document.getElementById('postID').value);
            const post = posts.find((p) => p.id === id);
            clearArticles();
            if (post) {
                showPosts([post]);
            } else {
                document.body.insertAdjacentHTML('beforeend',
                    '<article><p>Post not found.</p></article>');
            }
        });      
    </script>

</body>
</html>
