<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate a Cafe | Cup Critic</title>
  <!-- One stylesheet shared by every page -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with site name and navigation bar -->
  <header>
    <h1>Cup Critic</h1>
    <p>Cafe ratings for coffee lovers</p>
    <nav>
      <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="reviews.html">Reviews</a></li>
          <li><a href="compare.html">Compare</a></li>
          <li><a href="how-we-rate.html">How We Rate</a></li>
          <li><a href="submit.html" class="current">Rate a Cafe</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main content -->
  <main>
    <h1>Rate a cafe</h1>
    <p>Fill out every field to share your rating.</p>

    <!-- Form with built-in validation (required, type=email, minlength, maxlength) -->
    <form action="submit.html" method="get">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required minlength="2">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="cafe">Cafe name</label>
      <input type="text" id="cafe" name="cafe" required>

      <label for="rating">Rating</label>
      <select id="rating" name="rating" required>
        <option value="">Choose a rating</option>
        <option value="5">5 - Excellent</option>
        <option value="4">4 - Good</option>
        <option value="3">3 - Okay</option>
        <option value="2">2 - Poor</option>
        <option value="1">1 - Bad</option>
      </select>

      <label for="review">Your review (20 to 500 characters)</label>
      <textarea id="review" name="review" rows="5" required minlength="20" maxlength="500"></textarea>

      <input type="checkbox" id="agree" name="agree" required>
      <label class="check-label" for="agree">My review is honest.</label>
      <br>
      <button type="submit">Submit</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Cup Critic. The reviews are made up for a school project.</p>
    <p>Coffee news: <a href="https://perfectdailygrind.com" target="_blank" rel="noopener noreferrer">Perfect Daily Grind</a></p>
  </footer>
</body>
</html>
